<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#080808" />
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D7FF33" />
      <stop offset="100%" stop-color="#C7FF00" />
    </linearGradient>
  </defs>
  
  <!-- Background Rounded Shield / Square -->
  <rect width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  
  <!-- Geometric "B" & "A" Arena Mark -->
  <g transform="translate(24, 24)">
    <!-- Base Pillar -->
    <path d="M4 8 L24 8 C36 8 44 14 44 24 C44 31 39 37 31 39 C41 41 48 48 48 60 C48 72 38 80 24 80 L4 80 Z" fill="none" stroke="#F5F5F2" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Central Seam Slash / Electric Lime Accent -->
    <path d="M4 44 L32 44" stroke="url(#limeGrad)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="56" cy="18" r="7" fill="url(#limeGrad)" />
  </g>
</svg>
